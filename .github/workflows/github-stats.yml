name: Generate GitHub Stats

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Overview Stats
        uses: lowlighter/metrics@latest
        with:
          filename: github-stats/overview.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: iMoloy
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Dhaka


