name: Generate GitHub Stats

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats SVGs
        uses: jstrieb/github-stats@master
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          INCLUDE_FORKED_REPOS: "true"

      - name: Move generated images
        run: |
          mkdir -p github-stats
          cp generated/overview.svg github-stats/overview.svg 2>/dev/null || true
          cp generated/languages.svg github-stats/languages.svg 2>/dev/null || true

      - name: Commit and push stats images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update GitHub stats [skip ci]"
          file_pattern: "github-stats/*.svg"
